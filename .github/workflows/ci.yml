name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify repository structure
        run: |
          test -d docs || (echo "Missing /docs folder" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f RaceDay.Web/Dockerfile || (echo "Missing RaceDay.Web/Dockerfile" && exit 1)

      - name: Build the API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj -c Release

      - name: Build the MVC application
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj -c Release

      - name: Run the unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj -c Release

      - name: Build the MVC Docker image
        run: docker build -t raceday-web ./RaceDay.Web
